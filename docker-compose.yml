services:
  postgres:
    image: postgres:16-alpine
    container_name: canciones-postgres
    environment:
      POSTGRES_DB: canciones_db
      POSTGRES_USER: canciones_user
      POSTGRES_PASSWORD: canciones_pass
    ports:
      - "5433:5432"
    volumes:
      - canciones_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U canciones_user -d canciones_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: canciones-app
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: canciones_db
      DB_USERNAME: canciones_user
      DB_PASSWORD: canciones_pass
      LASTFM_API_KEY: ${LASTFM_API_KEY:-}
      LASTFM_USERNAME: ${LASTFM_USERNAME:-}
      ACCESS_KEY: ${ACCESS_KEY:-}
      CORS_ORIGINS: http://127.0.0.1:5173,http://localhost:5173,https://breimato.es,https://www.breimato.es
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  canciones_pg_data:
